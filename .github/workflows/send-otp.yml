
name: Send WhatsApp OTP

on:
  workflow_dispatch:
    inputs:
      phone:
        description: "Phone number with country code"
        required: true
        type: string

permissions:
  contents: read

jobs:
  send-otp:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Send WhatsApp OTP
        env:
          PHONE: ${{ inputs.phone }}
          WHATSAPP_SESSION: ${{ secrets.WHATSAPP_SESSION }}
          SESSION_ENCRYPTION_KEY: ${{ secrets.SESSION_ENCRYPTION_KEY }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node src/send-otp.js
