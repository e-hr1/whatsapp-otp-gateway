
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp OTP Verification</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #101827, #172c3c);
  padding: 20px;
  color: white;
}

.container {
  width: 100%;
  max-width: 410px;
  padding: 32px 25px;
  border-radius: 25px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  backdrop-filter: blur(20px);
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}

.logo {
  width: 75px;
  height: 75px;
  margin: 0 auto 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 23px;
  background: #20c76b;
  font-size: 38px;
}

h1 {
  text-align: center;
  font-size: 24px;
  margin-bottom: 10px;
}

.subtitle {
  color: #b5c4d2;
  text-align: center;
  font-size: 14px;
  line-height: 1.7;
  margin-bottom: 28px;
}

label {
  display: block;
  margin-bottom: 9px;
  font-size: 14px;
  color: #dce6ee;
}

.phone-group {
  display: flex;
  gap: 8px;
  direction: ltr;
}

select, input {
  width: 100%;
  padding: 15px;
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 12px;
  outline: none;
  background: rgba(255,255,255,.09);
  color: white;
  font-size: 15px;
}

select {
  width: 105px;
}

select option {
  color: black;
}

input::placeholder {
  color: #a2b1bd;
}

button {
  width: 100%;
  border: none;
  border-radius: 12px;
  padding: 15px;
  margin-top: 17px;
  background: #20c76b;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

button:hover {
  background: #18a957;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.otp-section {
  display: none;
  margin-top: 25px;
}

.otp-input {
  text-align: center;
  direction: ltr;
  letter-spacing: 12px;
  font-size: 23px;
  font-weight: bold;
}

.message {
  display: none;
  margin-top: 18px;
  padding: 13px;
  border-radius: 10px;
  text-align: center;
  font-size: 13px;
  line-height: 1.6;
  background: rgba(255,255,255,.08);
}

.footer {
  text-align: center;
  color: #8798a7;
  font-size: 12px;
  margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">☘</div>

  <h1>التحقق من رقم الهاتف</h1>

  <p class="subtitle">
    أدخل رقم هاتفك وسنرسل إليك رمز تحقق عبر واتساب.
  </p>

  <div id="phoneSection">

    <label>رقم الهاتف</label>

    <div class="phone-group">
      <select id="countryCode">
        <option value="967">+967</option>
        <option value="966">+966</option>
        <option value="971">+971</option>
        <option value="20">+20</option>
        <option value="965">+965</option>
        <option value="974">+974</option>
        <option value="1">+1</option>
      </select>

      <input
        id="phone"
        type="tel"
        placeholder="7XXXXXXXX"
        maxlength="15"
        autocomplete="tel-national"
      >
    </div>

    <button id="sendButton" onclick="sendOTP()">
      إرسال رمز التحقق
    </button>

  </div>

  <div class="otp-section" id="otpSection">

    <label>رمز التحقق</label>

    <input
      class="otp-input"
      id="otp"
      type="text"
      inputmode="numeric"
      maxlength="6"
      placeholder="000000"
    >

    <button id="verifyButton" onclick="verifyOTP()">
      تأكيد الرمز
    </button>

  </div>

  <div class="message" id="message"></div>

  <div class="footer">
    WhatsApp OTP Verification System
  </div>

</div>

<script>
/*
  لا يوجد خادم إرسال OTP جاهز حتى الآن.
  ضع رابط API الحقيقي هنا بعد إنشائه.
*/
const API_URL = "YOUR_API_URL";

let currentPhone = "";

function showMessage(text) {
  const box = document.getElementById("message");
  box.textContent = text;
  box.style.display = "block";
}

async function sendOTP() {
  const code = document.getElementById("countryCode").value;
  const number = document.getElementById("phone").value.trim();
  const button = document.getElementById("sendButton");

  if (!/^[0-9]{7,15}$/.test(number)) {
    showMessage("يرجى إدخال رقم هاتف صحيح.");
    return;
  }

  currentPhone = code + number;

  if (API_URL === "YOUR_API_URL") {
    showMessage(
      "واجهة الصفحة جاهزة، لكن خادم إرسال واتساب لم يتم ربطه بعد."
    );
    return;
  }

  button.disabled = true;
  button.textContent = "جارٍ الإرسال...";

  try {
    const response = await fetch(API_URL + "/send-otp", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        phone: currentPhone
      })
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.message || "تعذر إرسال الرمز");
    }

    document.getElementById("otpSection").style.display = "block";
    showMessage("تم طلب إرسال رمز التحقق إلى واتساب.");

  } catch (error) {
    showMessage(error.message);
  } finally {
    button.disabled = false;
    button.textContent = "إرسال رمز التحقق";
  }
}

async function verifyOTP() {
  const otp = document.getElementById("otp").value.trim();
  const button = document.getElementById("verifyButton");

  if (!/^[0-9]{6}$/.test(otp)) {
    showMessage("أدخل رمز التحقق المكوّن من 6 أرقام.");
    return;
  }

  if (API_URL === "YOUR_API_URL") {
    showMessage("لم يتم ربط خادم التحقق بعد.");
    return;
  }

  button.disabled = true;

  try {
    const response = await fetch(API_URL + "/verify-otp", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        phone: currentPhone,
        otp: otp
      })
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.message || "الرمز غير صحيح");
    }

    showMessage("تم التحقق من رقم هاتفك بنجاح!");

  } catch (error) {
    showMessage(error.message);
  } finally {
    button.disabled = false;
  }
}
</script>

</body>
</html>
