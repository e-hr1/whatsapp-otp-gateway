
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>WhatsApp OTP Verification</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: white;
      background:
        radial-gradient(circle at top, #1d3557, transparent 55%),
        #101827;
    }

    .container {
      width: 100%;
      max-width: 430px;
      padding: 30px 24px;
      border: 1px solid #ffffff20;
      border-radius: 24px;
      background: #ffffff0d;
      backdrop-filter: blur(18px);
      box-shadow: 0 20px 60px #0005;
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 22px;
      background: #20c87920;
      font-size: 38px;
    }

    h1 {
      text-align: center;
      font-size: 23px;
      margin: 0 0 10px;
    }

    .description {
      text-align: center;
      color: #aab7ca;
      font-size: 13px;
      line-height: 1.9;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-size: 14px;
      color: #dce5f2;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ffffff25;
      border-radius: 12px;
      outline: none;
      background: #ffffff0d;
      color: white;
      font-size: 16px;
      direction: ltr;
      text-align: left;
      margin-bottom: 18px;
    }

    input:focus {
      border-color: #20c879;
    }

    input::placeholder {
      color: #7d8ba1;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #20c879;
      color: #062b1b;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    button:hover {
      background: #32e08c;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .status {
      display: none;
      margin-top: 20px;
      padding: 14px;
      border-radius: 12px;
      background: #ffffff0d;
      font-size: 13px;
      line-height: 1.9;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .status.error {
      display: block;
      background: #ff45451a;
      color: #ff9999;
    }

    .status.success {
      display: block;
      background: #20c8791a;
      color: #70e6a9;
    }

    .status.loading {
      display: block;
      color: #b9d7ff;
    }

    .footer {
      margin-top: 25px;
      text-align: center;
      color: #718096;
      font-size: 11px;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">💬</div>

    <h1>التحقق عبر واتساب</h1>

    <p class="description">
      أدخل رقم هاتفك مع مفتاح الدولة،
      وسنرسل إليك رمز التحقق عبر واتساب.
    </p>

    <form id="otpForm">

      <label for="phone">رقم الهاتف</label>

      <input
        type="tel"
        id="phone"
        placeholder="9677XXXXXXXX"
        autocomplete="tel"
        maxlength="15"
        required
      >

      <button type="submit" id="sendBtn">
        إرسال رمز التحقق
      </button>

    </form>

    <div id="status" class="status"></div>

    <div class="footer">
      WhatsApp OTP Verification
    </div>

  </main>

  <script>
    /*
      ضع هنا رابط الخادم الخلفي بعد نشره.
      لا تضع GitHub Token أو أي سر في هذا الملف.
    */
    const API_BASE_URL = "https://YOUR-BACKEND-DOMAIN";

    const form = document.getElementById("otpForm");
    const phoneInput = document.getElementById("phone");
    const sendBtn = document.getElementById("sendBtn");
    const statusBox = document.getElementById("status");

    let requestRunning = false;

    function showStatus(message, type) {
      statusBox.textContent = message;
      statusBox.className = "status " + type;
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (requestRunning) return;

      const phone = phoneInput.value.replace(/\D/g, "");

      if (!/^\d{8,15}$/.test(phone)) {
        showStatus("يرجى إدخال رقم هاتف صحيح مع مفتاح الدولة.", "error");
        return;
      }

      if (API_BASE_URL.includes("YOUR-BACKEND-DOMAIN")) {
        showStatus(
          "لم يتم إعداد رابط الخادم بعد. يجب نشر الخادم الخلفي أولاً.",
          "error"
        );
        return;
      }

      requestRunning = true;
      sendBtn.disabled = true;
      sendBtn.textContent = "جارٍ إرسال الطلب...";

      try {
        showStatus("جارٍ الاتصال بالخادم...", "loading");

        const response = await fetch(
          API_BASE_URL + "/api/send-otp",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ phone })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || "تعذر إرسال الطلب");
        }

        if (!data.run_id) {
          throw new Error("لم يتم استلام رقم تشغيل الطلب");
        }

        showStatus("تم تشغيل الطلب. ننتظر نتيجة واتساب...", "loading");

        let completed = false;

        for (let i = 0; i < 60; i++) {
          await sleep(3000);

          const statusResponse = await fetch(
            API_BASE_URL + "/api/status/" +
            encodeURIComponent(data.run_id)
          );

          const statusData = await statusResponse.json();

          if (!statusResponse.ok) {
            throw new Error(
              statusData.message || "تعذر متابعة حالة الطلب"
            );
          }

          if (statusData.status === "completed") {
            completed = true;

            if (statusData.conclusion === "success") {
              showStatus(
                "اكتمل تشغيل الخدمة بنجاح. تحقق من رسائل واتساب.",
                "success"
              );
            } else {
              showStatus(
                "فشل تشغيل خدمة الإرسال. تحقق من سجل GitHub Actions.",
                "error"
              );
            }

            break;
          }

          showStatus(
            "الخدمة تعمل... الحالة: " + statusData.status,
            "loading"
          );
        }

        if (!completed) {
          showStatus(
            "انتهت مهلة الانتظار. تحقق من حالة الطلب في GitHub Actions.",
            "error"
          );
        }

      } catch (error) {
        showStatus(error.message || "حدث خطأ أثناء الاتصال بالخادم.", "error");
      } finally {
        requestRunning = false;
        sendBtn.disabled = false;
        sendBtn.textContent = "إرسال رمز التحقق";
      }
    });
  </script>

</body>
</html>
